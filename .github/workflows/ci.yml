name: CI — WorkCheck Kachchh Tests & Parity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend & bridge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workcheck_platform/requirements.txt

      - name: Run Platform, Security & Live API tests
        working-directory: workcheck_platform
        run: python -m pytest tests -v

      - name: Run Wokwi Bridge tests
        working-directory: wokwi_bridge
        run: python -m pytest test_bridge.py -v

      - name: Verify root vs workcheck_platform/static parity & zero secret keys in JS
        run: |
          python - <<'PY'
          import hashlib, os, sys
          shared = ["styles.css", "icons.js", "qrcode.js", "favicon.svg", "favicon.ico", "manifest.webmanifest", "robots.txt", "sitemap.xml", "sw.js"]
          shared += [f"js/{f}" for f in sorted(os.listdir("js")) if f.endswith(".js") and f != "mock_data.js"]
          for rel in shared:
              with open(rel, "rb") as a, open(os.path.join("workcheck_platform", "static", rel), "rb") as b:
                  if hashlib.sha256(a.read()).digest() != hashlib.sha256(b.read()).digest():
                      sys.exit(f"Static mirror drift detected: {rel}")
          for rel in shared:
              if rel.startswith("js/"):
                  txt = open(rel, encoding="utf-8").read()
                  if "demo-device-key" in txt:
                      sys.exit(f"Forbidden device API key string in client JS: {rel}")
          print(f"Verified parity on {len(shared)} static assets.")
          PY
